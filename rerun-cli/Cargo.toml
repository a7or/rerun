[package]
edition = "2024"
rust-version = "1.96"
name = "rerun-cli"
version = "0.40.0"
authors = ["rerun.io <opensource@rerun.io>"]
build = "build.rs"
include = [
    "../../Cargo.lock",
    "../../LICENSE-APACHE",
    "../../LICENSE-MIT",
    "**/*.bin",
    "**/*.rs",
    "Cargo.toml",
]
publish = true
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
default-run = "rerun"
description = "The Rerun command-line tool: the `rerun` binary, including the native Viewer"
homepage = "https://rerun.io"
readme = "README.md"
keywords = [
    "mesh",
    "plotting",
    "point-cloud",
    "robotics",
    "visualization",
]
categories = [
    "visualization",
    "computer-vision",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/rerun-io/rerun"
resolver = "2"

[package.metadata.docs.rs]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "wasm32-unknown-unknown",
]

[package.metadata.cargo-shear]
ignored = ["re_server"]

[features]
audio = ["rerun/audio"]
base = [
    "audio",
    "native_viewer",
    "map_view",
    "oss_server",
    "perf_telemetry",
]
default = [
    "web_viewer",
    "base",
]
lance = ["re_server/lance"]
map_view = ["rerun/map_view"]
nasm = ["rerun/nasm"]
