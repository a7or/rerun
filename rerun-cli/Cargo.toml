oss_server = ["rerun/oss_server"]
perf_telemetry = ["rerun/perf_telemetry"]
release_full = [
    "release_no_web_viewer",
    "web_viewer",
]
release_no_web_viewer = [
    "base",
    "lance",
    "nasm",
]
web_viewer = [
    "rerun/web_viewer",
    "rerun/sdk",
]

[[bin]]
name = "rerun"
path = "src/bin/rerun.rs"
doc = false

[dependencies.document-features]
version = "0.2.12"

[dependencies.mimalloc]
version = "0.1.48"
features = ["v3"]

[dependencies.re_build_info]
version = "0.40.0"
default-features = false

[dependencies.re_error]
version = "0.40.0"
default-features = false

[dependencies.re_log]
version = "0.40.0"
features = ["setup"]
default-features = false

[dependencies.re_memory]
version = "0.40.0"
default-features = false

[dependencies.re_server]
version = "0.40.0"
optional = true
default-features = false

[dependencies.rerun]
version = "0.40.0"
features = [
    "analytics",
    "importers",
    "glam",
    "image",
    "log",
    "run",
    "server",
    "video",
]
default-features = false

[build-dependencies.re_build_tools]
version = "0.40.0"
default-features = false

[target."cfg(rerun_workspace_hack)".dependencies.re_workspace_hack]
version = "0.0.0"

