[package]
edition = "2024"
rust-version = "1.96"
name = "re_viewer"
version = "0.40.0"
authors = ["rerun.io <opensource@rerun.io>"]
build = "build.rs"
include = [
    "../../Cargo.lock",
    "../../LICENSE-APACHE",
    "../../LICENSE-MIT",
    "**/*.rs",
    "agent_context/**/*.cpp",
    "agent_context/**/*.in",
    "agent_context/**/*.md",
    "agent_context/**/*.py",
    "agent_context/**/*.rs",
    "agent_context/**/*.toml",
    "agent_context/**/*.txt",
    "agent_context/**/*.yaml",
    "Cargo.toml",
    "data/**/*.cpp",
    "data/**/*.jpg",
    "data/**/*.md",
    "data/**/*.png",
    "data/**/*.py",
    "data/**/*.rs",
    "data/**/*.svg",
]
publish = true
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "The Rerun viewer"
homepage = "https://rerun.io"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rerun-io/rerun"
resolver = "2"

[package.metadata.docs.rs]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "wasm32-unknown-unknown",
]

[package.metadata.cargo-shear]
ignored = ["wasm-bindgen-futures"]
ignored-paths = ["data/quick_start_guides/*.rs"]

[features]
agent_context = []
analytics = [
    "dep:re_analytics",
    "re_dataframe_ui/analytics",
    "re_ui/analytics",
]
audio = [
    "re_audio/output",
    "dep:re_view_audio",
]
default = [
    "agent_context",
    "analytics",
    "default_web",
]
default_web = [
    "audio",
    "map_view",
]
map_view = ["dep:re_view_map"]
perf_telemetry = [
    "dep:re_perf_telemetry",
    "re_redap_client/perf_telemetry",
]
perf_telemetry_tracy = [
    "perf_telemetry",
    "re_perf_telemetry/tracy",
]
testing = [
    "dep:tokio",
    "re_ui/testing",
    "re_analytics/testing",
]

[lib]
name = "re_viewer"
crate-type = [
    "cdylib",
    "rlib",
]
path = "src/lib.rs"

[[bin]]
name = "viewer"
path = "src/bin/viewer/main.rs"

[[test]]
name = "integration"
path = "tests/integration/main.rs"

